name: Build ZenithSkyPvP
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Java and Maven
        run: |
          java -version
          mvn -version
      - name: Build
        run: mvn -B clean package -DskipTests
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ZenithSkyPvP-2.2.0
          path: target/ZenithSkyPvP-2.2.0.jar
          if-no-files-found: error
